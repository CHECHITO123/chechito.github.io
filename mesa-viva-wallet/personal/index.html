<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19231d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mesa Viva Scan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mesa Viva Scan</title>
  <style>
    :root{--ink:#19231d;--olive:#314734;--lime:#d6e65a;--cream:#f4f0e7;--paper:#fffdf8;--line:#d9d9cd;--red:#8d3528;--muted:#687069}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}.app{width:min(760px,100%);min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 0 50px #19231d18}.appbar{min-height:82px;padding:max(18px,env(safe-area-inset-top)) 22px 18px;background:var(--ink);color:#fff;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}.mark{width:42px;height:42px;border:1px solid #ffffffaa;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}.appbar h1{margin:0;text-align:center;font:500 25px Georgia,serif}.menu{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:25px}.merchant{padding:28px 20px 20px;text-align:center;background:#fff}.eyebrow{margin:0 0 8px;color:var(--olive);font-size:11px;font-weight:800;letter-spacing:.18em}.merchant h2{margin:0;font:500 clamp(25px,6vw,34px) Georgia,serif}.quick-actions{padding:18px 22px 28px;background:#fff;display:flex;justify-content:center;gap:clamp(34px,12vw,88px)}.round-action{width:76px;border:0;background:none;color:var(--ink);display:grid;justify-items:center;gap:8px;font-size:12px;font-weight:700}.round-action span{width:64px;height:64px;border-radius:50%;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center;font-size:27px;box-shadow:0 5px 12px #19231d22}.scan-home{min-height:420px;padding:44px 22px calc(44px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 42%,#58725b 0 90px,transparent 91px),linear-gradient(145deg,#294232,#19231d 70%);color:#fff;display:grid;place-items:center}.scan-button{width:180px;height:180px;border:1px solid #d6e65a88;border-radius:50%;background:#ffffff0b;color:#fff;font-size:30px;font-weight:700;box-shadow:0 0 0 22px #ffffff0b,0 0 0 44px #ffffff08}.scan-button small{display:block;margin-top:8px;color:var(--lime);font-size:12px;letter-spacing:.12em}.panel{padding:24px 20px calc(34px + env(safe-area-inset-bottom));background:var(--cream)}.panel[hidden]{display:none}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-head h2{margin:0;font:500 30px Georgia,serif}.close{border:1px solid var(--line);border-radius:999px;background:#fff;padding:10px 14px;color:var(--ink);font-weight:800}.camera{width:100%;aspect-ratio:4/3;background:var(--ink);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 16px 40px #19231d35}.camera video{width:100%;height:100%;object-fit:cover}.camera:after{content:"";position:absolute;width:min(58vw,280px);height:min(58vw,280px);max-height:70%;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid var(--lime);border-radius:20px;box-shadow:0 0 0 999px #0006}.status{min-height:22px;margin:15px 4px;color:var(--olive);text-align:center;font-weight:700;line-height:1.45}.manual{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.manual input{min-width:0;border:1px solid var(--line);border-radius:999px;background:#fff;padding:14px 17px;font-size:16px;text-transform:uppercase}.scan-alt{margin-top:16px;padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center}.scan-alt p{margin:0 0 11px;color:var(--muted);font-size:14px}.photo-button{display:inline-block}.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.button{border:0;border-radius:999px;padding:14px 18px;background:var(--lime);color:var(--ink);font-weight:800}.customer-card{border-radius:26px;background:linear-gradient(135deg,#294232,#48603f);color:#fff;padding:24px;box-shadow:0 18px 40px #19231d35}.customer-top{display:flex;justify-content:space-between;gap:12px}.customer-top p{margin:0 0 5px;color:#dbe4da;font-size:12px}.customer-top h3{margin:0;font:500 32px Georgia,serif}.member-label{font-size:13px;font-weight:800;letter-spacing:.1em}.count{margin:30px 0 0;font:500 76px/1 Georgia,serif;color:var(--lime)}.count-label{margin:5px 0 0;color:#dbe4da}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.actions .button{min-height:58px}.button.remove{background:#f1c8bd;color:var(--red)}.new-scan{width:100%;margin-top:12px;background:var(--ink);color:#fff}.info-box{border:1px solid var(--line);border-radius:20px;background:#fff;padding:18px;color:var(--muted);line-height:1.55}.info-box h3{margin:0 0 8px;color:var(--ink);font:500 24px Georgia,serif}.install{display:none;width:100%;margin-top:14px;background:var(--ink);color:#fff}.install.show{display:block}.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:10;background:var(--ink);color:#fff;padding:13px 19px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:480px){.manual,.actions{grid-template-columns:1fr}.manual .button{width:100%}}@media(min-width:761px){body{padding:24px}.app{min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden}}
  </style>
</head>
<body>
  <main class="app">
    <header class="appbar"><span class="mark">MV</span><h1>Mesa Viva Scan</h1><button class="menu" id="menu" type="button" aria-label="Instalar o ver ayuda">⋮</button></header>
    <section id="home">
      <div class="merchant"><p class="eyebrow">CONTROL DE FIDELIZACIÓN</p><h2>MV-RESTAURANTE · MESA VIVA</h2></div>
      <div class="quick-actions"><button class="round-action" id="stats" type="button"><span>▥</span>Actividad</button><button class="round-action" id="help" type="button"><span>?</span>Ayuda</button></div>
      <div class="scan-home"><button class="scan-button" id="scan" type="button">Scan<small>ESCANEAR QR</small></button></div>
    </section>
    <section class="panel" id="scanner" hidden>
      <div class="panel-head"><h2>Escanear tarjeta</h2><button class="close" id="cancel-scan" type="button">Cancelar</button></div>
      <div class="camera"><video id="video" playsinline muted></video></div>
      <p class="status" id="scan-status" role="status">Apunta al QR del cliente.</p>
      <div class="manual"><input id="member-input" placeholder="Código: MV-0248" autocomplete="off" aria-label="Código de socio"><button class="button" id="search" type="button">Abrir tarjeta</button></div>
           <div class="scan-alt"><p>¿El QR está en este mismo móvil o la cámara no funciona?</p><label class="button photo-button" for="qr-image">Elegir foto del QR</label><input class="file-input" id="qr-image" type="file" accept="image/*" aria-label="Elegir una foto del código QR"></div>
      <canvas id="qr-canvas" hidden></canvas>
    </section>
    <section class="panel" id="customer" hidden>
      <div class="panel-head"><h2>Cliente identificado</h2><button class="close" id="close-customer" type="button">Cerrar</button></div>
      <article class="customer-card"><div class="customer-top"><div><p>TITULAR</p><h3 id="customer-name">Vincenzo</h3></div><strong class="member-label" id="member-label">MV-0248</strong></div><div class="count" id="count">0</div><p class="count-label" id="count-label">visitas registradas</p></article>
      <div class="actions"><button class="button" id="add" type="button">+ Añadir visita</button><button class="button remove" id="remove" type="button">− Corregir visita</button></div>
      <button class="button new-scan" id="new-scan" type="button">Escanear otra tarjeta</button>
    </section>
    <section class="panel" id="info" hidden>
      <div class="panel-head"><h2 id="info-title">Ayuda</h2><button class="close" id="close-info" type="button">Cerrar</button></div>
      <div class="info-box" id="info-copy"></div><button class="button install" id="install" type="button">Instalar app en esta tablet</button>
    </section>
  </main>
  <div class="toast" id="toast">Visitas actualizadas</div>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const screens=["home","scanner","customer","info"];let activeMember="",visits=0,stream=null,scanning=false,installPrompt=null,detector=null,lastDecode=0;const input=document.querySelector("#member-input"),status=document.querySelector("#scan-status"),toast=document.querySelector("#toast"),video=document.querySelector("#video"),canvas=document.querySelector("#qr-canvas"),canvasContext=canvas.getContext("2d",{willReadFrequently:true});
    function showScreen(id){screens.forEach(name=>document.querySelector(`#${name}`).hidden=name!==id);if(id!=="scanner")stopCamera();window.scrollTo({top:0,behavior:"smooth"})}
    function normalize(value){const match=String(value).toUpperCase().match(/MV[- ]?\d{4}/);return match?match[0].replace(" ","-"):""}
    function key(member){return `mesa-viva-${member}-visits-v2`}
    function openMember(raw){const member=normalize(raw);if(!member){status.textContent="Código no reconocido. Usa un código como MV-0248.";return}activeMember=member;visits=Math.max(0,Math.min(10,Number(localStorage.getItem(key(member))||0)));document.querySelector("#member-label").textContent=member;document.querySelector("#customer-name").textContent=localStorage.getItem(`mesa-viva-${member}-name-v2`)||"Vincenzo";render();showScreen("customer")}
    function render(){document.querySelector("#count").textContent=visits;document.querySelector("#count-label").textContent=visits===1?"visita registrada":"visitas registradas"}
    function save(delta){if(!activeMember)return;visits=Math.max(0,Math.min(10,visits+delta));localStorage.setItem(key(activeMember),String(visits));render();toast.textContent=delta>0?"Visita añadida":"Visita corregida";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1400)}
    function decodeFrame(source,width,height){if(!window.jsQR||!width||!height)return "";const scale=Math.min(1,1400/Math.max(width,height));const w=Math.max(1,Math.round(width*scale)),h=Math.max(1,Math.round(height*scale));canvas.width=w;canvas.height=h;canvasContext.drawImage(source,0,0,w,h);const pixels=canvasContext.getImageData(0,0,w,h);const result=window.jsQR(pixels.data,w,h,{inversionAttempts:"attemptBoth"});return result?.data||""}
    async function startCamera(){showScreen("scanner");status.textContent="Abriendo la cámara…";if(!window.isSecureContext){status.textContent="La cámara necesita una conexión segura. Abre esta página en Safari o Chrome.";return}if(!navigator.mediaDevices?.getUserMedia){status.textContent="Este navegador no permite usar la cámara. Abre la página en Safari o Chrome, elige una foto del QR o escribe el código.";return}try{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}catch(error){if(error.name!=="OverconstrainedError")throw error;stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}video.srcObject=stream;await video.play();detector=null;if("BarcodeDetector" in window){try{detector=new BarcodeDetector({formats:["qr_code"]})}catch{detector=null}}scanning=true;lastDecode=0;status.textContent="Apunta al QR del cliente. La lectura es automática.";requestAnimationFrame(detect)}catch(error){const embedded=/Instagram|FBAN|FBAV|Line/|LinkedInApp|WhatsApp/i.test(navigator.userAgent);if(embedded)status.textContent="WhatsApp o LinkedIn puede bloquear la cámara. Abre esta página en Safari o Chrome.";else if(error.name==="NotAllowedError")status.textContent="Permite el acceso a la cámara en los ajustes del navegador, o elige una foto del QR.";else if(error.name==="NotFoundError")status.textContent="No se encontró una cámara. Elige una foto del QR o escribe el código.";else if(error.name==="NotReadableError")status.textContent="La cámara está ocupada por otra aplicación. Ciérrala e inténtalo de nuevo.";else status.textContent="No se pudo abrir la cámara. Elige una foto del QR o escribe el código."}}
    async function detect(timestamp){if(!scanning)return;if(timestamp-lastDecode<140){requestAnimationFrame(detect);return}lastDecode=timestamp;let raw="";try{if(detector){const codes=await detector.detect(video);raw=codes[0]?.rawValue||""}else if(video.readyState>=2){raw=decodeFrame(video,video.videoWidth,video.videoHeight)}}catch{}if(raw){openMember(raw);return}requestAnimationFrame(detect)}
    function readQrImage(file){if(!file)return;stopCamera();status.textContent="Leyendo la foto…";const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{const raw=decodeFrame(image,image.naturalWidth,image.naturalHeight);URL.revokeObjectURL(url);if(raw)openMember(raw);else status.textContent="No se encontró un QR válido en la foto. Prueba con una imagen más nítida o escribe el código."};image.onerror=()=>{URL.revokeObjectURL(url);status.textContent="No se pudo leer la imagen. Prueba con otra foto."};image.src=url}
    function stopCamera(){scanning=false;detector=null;if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}video.srcObject=null}
    function showInfo(kind){const title=document.querySelector("#info-title"),copy=document.querySelector("#info-copy");if(kind==="stats"){title.textContent="Actividad";copy.innerHTML="<h3>Control de visitas</h3><p>Escanea una tarjeta para consultar y actualizar sus visitas. Cada cliente se identifica mediante su código individual.</p>"}else{title.textContent="Ayuda e instalación";copy.innerHTML="<h3>Cómo usar Mesa Viva Scan</h3><p>Pulsa <strong>Scan</strong>, permite el acceso a la cámara y apunta al QR de la tarjeta. Después podrás añadir una visita o corregirla.</p><p>Esta zona es únicamente para el personal.</p>"}document.querySelector("#install").classList.toggle("show",Boolean(installPrompt));showScreen("info")}
    document.querySelector("#scan").addEventListener("click",startCamera);document.querySelector("#cancel-scan").addEventListener("click",()=>showScreen("home"));document.querySelector("#search").addEventListener("click",()=>openMember(input.value));document.querySelector("#qr-image").addEventListener("change",event=>readQrImage(event.target.files[0]));input.addEventListener("keydown",event=>{if(event.key==="Enter")openMember(input.value)});document.querySelector("#add").addEventListener("click",()=>save(1));document.querySelector("#remove").addEventListener("click",()=>save(-1));document.querySelector("#new-scan").addEventListener("click",startCamera);document.querySelector("#close-customer").addEventListener("click",()=>showScreen("home"));document.querySelector("#stats").addEventListener("click",()=>showInfo("stats"));document.querySelector("#help").addEventListener("click",()=>showInfo("help"));document.querySelector("#menu").addEventListener("click",()=>showInfo("help"));document.querySelector("#close-info").addEventListener("click",()=>showScreen("home"));window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});document.querySelector("#install").addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.querySelector("#install").classList.remove("show")});window.addEventListener("beforeunload",stopCamera);if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
