<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19231d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mesa Viva Scan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mesa Viva Scan</title>
  <style>
    :root{--ink:#19231d;--olive:#314734;--lime:#d6e65a;--cream:#f4f0e7;--paper:#fffdf8;--line:#d9d9cd;--red:#8d3528;--muted:#687069}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}.app{width:min(760px,100%);min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 0 50px #19231d18}.appbar{min-height:82px;padding:max(18px,env(safe-area-inset-top)) 22px 18px;background:var(--ink);color:#fff;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}.mark{width:42px;height:42px;border:1px solid #ffffffaa;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}.appbar h1{margin:0;text-align:center;font:500 25px Georgia,serif}.menu{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:25px}.merchant{padding:28px 20px 20px;text-align:center;background:#fff}.eyebrow{margin:0 0 8px;color:var(--olive);font-size:11px;font-weight:800;letter-spacing:.18em}.merchant h2{margin:0;font:500 clamp(25px,6vw,34px) Georgia,serif}.quick-actions{padding:18px 22px 28px;background:#fff;display:flex;justify-content:center;gap:clamp(34px,12vw,88px)}.round-action{width:76px;border:0;background:none;color:var(--ink);display:grid;justify-items:center;gap:8px;font-size:12px;font-weight:700}.round-action span{width:64px;height:64px;border-radius:50%;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center;font-size:27px;box-shadow:0 5px 12px #19231d22}.scan-home{min-height:420px;padding:44px 22px calc(44px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 42%,#58725b 0 90px,transparent 91px),linear-gradient(145deg,#294232,#19231d 70%);color:#fff;display:grid;place-items:center}.scan-button{width:180px;height:180px;border:1px solid #d6e65a88;border-radius:50%;background:#ffffff0b;color:#fff;font-size:30px;font-weight:700;box-shadow:0 0 0 22px #ffffff0b,0 0 0 44px #ffffff08}.scan-button small{display:block;margin-top:8px;color:var(--lime);font-size:12px;letter-spacing:.12em}.panel{padding:24px 20px calc(34px + env(safe-area-inset-bottom));background:var(--cream)}.panel[hidden]{display:none}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-head h2{margin:0;font:500 30px Georgia,serif}.close{border:1px solid var(--line);border-radius:999px;background:#fff;padding:10px 14px;color:var(--ink);font-weight:800}.camera{width:100%;aspect-ratio:4/3;background:var(--ink);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 16px 40px #19231d35}.camera video{width:100%;height:100%;object-fit:cover}.camera:after{content:"";position:absolute;width:min(58vw,280px);height:min(58vw,280px);max-height:70%;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid var(--lime);border-radius:20px;box-shadow:0 0 0 999px #0006}.status{min-height:22px;margin:15px 4px;color:var(--olive);text-align:center;font-weight:700;line-height:1.45}.manual{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.manual input{min-width:0;border:1px solid var(--line);border-radius:999px;background:#fff;padding:14px 17px;font-size:16px;text-transform:uppercase}.button{border:0;border-radius:999px;padding:14px 18px;background:var(--lime);color:var(--ink);font-weight:800}.customer-card{border-radius:26px;background:linear-gradient(135deg,#294232,#48603f);color:#fff;padding:24px;box-shadow:0 18px 40px #19231d35}.customer-top{display:flex;justify-content:space-between;gap:12px}.customer-top p{margin:0 0 5px;color:#dbe4da;font-size:12px}.customer-top h3{margin:0;font:500 32px Georgia,serif}.member-label{font-size:13px;font-weight:800;letter-spacing:.1em}.count{margin:30px 0 0;font:500 76px/1 Georgia,serif;color:var(--lime)}.count-label{margin:5px 0 0;color:#dbe4da}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.actions .button{min-height:58px}.button.remove{background:#f1c8bd;color:var(--red)}.new-scan{width:100%;margin-top:12px;background:var(--ink);color:#fff}.info-box{border:1px solid var(--line);border-radius:20px;background:#fff;padding:18px;color:var(--muted);line-height:1.55}.info-box h3{margin:0 0 8px;color:var(--ink);font:500 24px Georgia,serif}.install{display:none;width:100%;margin-top:14px;background:var(--ink);color:#fff}.install.show{display:block}.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:10;background:var(--ink);color:#fff;padding:13px 19px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:480px){.manual,.actions{grid-template-columns:1fr}.manual .button{width:100%}}@media(min-width:761px){body{padding:24px}.app{min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden}}
  </style>
</head>
<body>
  <main class="app">
    <header class="appbar"><span class="mark">MV</span><h1>Mesa Viva Scan</h1><button class="menu" id="menu" type="button" aria-label="Instalar o ver ayuda">⋮</button></header>
    <section id="home">
      <div class="merchant"><p class="eyebrow">CONTROL DE FIDELIZACIÓN</p><h2>MV-RESTAURANTE · MESA VIVA</h2></div>
      <div class="quick-actions"><button class="round-action" id="stats" type="button"><span>▥</span>Actividad</button><button class="round-action" id="help" type="button"><span>?</span>Ayuda</button></div>
      <div class="scan-home"><button class="scan-button" id="scan" type="button">Scan<small>ESCANEAR QR</small></button></div>
    </section>
    <section class="panel" id="scanner" hidden>
      <div class="panel-head"><h2>Escanear tarjeta</h2><button class="close" id="cancel-scan" type="button">Cancelar</button></div>
      <div class="camera"><video id="video" playsinline muted></video></div>
      <p class="status" id="scan-status" role="status">Apunta al QR del cliente.</p>
      <div class="manual"><input id="member-input" placeholder="Código: MV-0248" autocomplete="off" aria-label="Código de socio"><button class="button" id="search" type="button">Abrir tarjeta</button></div>
    </section>
    <section class="panel" id="customer" hidden>
      <div class="panel-head"><h2>Cliente identificado</h2><button class="close" id="close-customer" type="button">Cerrar</button></div>
      <article class="customer-card"><div class="customer-top"><div><p>TITULAR</p><h3 id="customer-name">Vincenzo</h3></div><strong class="member-label" id="member-label">MV-0248</strong></div><div class="count" id="count">0</div><p class="count-label" id="count-label">visitas registradas</p></article>
      <div class="actions"><button class="button" id="add" type="button">+ Añadir visita</button><button class="button remove" id="remove" type="button">− Corregir visita</button></div>
      <button class="button new-scan" id="new-scan" type="button">Escanear otra tarjeta</button>
    </section>
    <section class="panel" id="info" hidden>
      <div class="panel-head"><h2 id="info-title">Ayuda</h2><button class="close" id="close-info" type="button">Cerrar</button></div>
      <div class="info-box" id="info-copy"></div><button class="button install" id="install" type="button">Instalar app en esta tablet</button>
    </section>
  </main>
  <div class="toast" id="toast">Visitas actualizadas</div>
  <script>
    const screens=["home","scanner","customer","info"];let activeMember="",visits=0,stream=null,scanning=false,installPrompt=null;const input=document.querySelector("#member-input"),status=document.querySelector("#scan-status"),toast=document.querySelector("#toast");
    function showScreen(id){screens.forEach(name=>document.querySelector(`#${name}`).hidden=name!==id);if(id!=="scanner")stopCamera();window.scrollTo({top:0,behavior:"smooth"})}
    function normalize(value){const match=String(value).toUpperCase().match(/MV[- ]?\d{4}/);return match?match[0].replace(" ","-"):""}
    function key(member){return `mesa-viva-${member}-visits-v2`}
    function openMember(raw){const member=normalize(raw);if(!member){status.textContent="Código no reconocido. Usa un código como MV-0248.";return}activeMember=member;visits=Math.max(0,Math.min(10,Number(localStorage.getItem(key(member))||0)));document.querySelector("#member-label").textContent=member;document.querySelector("#customer-name").textContent=localStorage.getItem(`mesa-viva-${member}-name-v2`)||"Vincenzo";render();showScreen("customer")}
    function render(){document.querySelector("#count").textContent=visits;document.querySelector("#count-label").textContent=visits===1?"visita registrada":"visitas registradas"}
    function save(delta){if(!activeMember)return;visits=Math.max(0,Math.min(10,visits+delta));localStorage.setItem(key(activeMember),String(visits));render();toast.textContent=delta>0?"Visita añadida":"Visita corregida";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1400)}
    async function startCamera(){showScreen("scanner");status.textContent="Abriendo la cámara…";if(!navigator.mediaDevices?.getUserMedia){status.textContent="La cámara no está disponible. Introduce el código manualmente.";return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});const video=document.querySelector("#video");video.srcObject=stream;await video.play();status.textContent="Apunta al QR del cliente.";if("BarcodeDetector" in window){scanning=true;detect()}else status.textContent="La cámara está abierta. Si no detecta el QR, introduce el código que aparece debajo."}catch{status.textContent="No se pudo abrir la cámara. Permite el acceso o introduce el código manualmente."}}
    async function detect(){if(!scanning)return;try{const detector=new BarcodeDetector({formats:["qr_code"]});const codes=await detector.detect(document.querySelector("#video"));if(codes[0]){openMember(codes[0].rawValue);return}}catch{}requestAnimationFrame(detect)}
    function stopCamera(){scanning=false;if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}document.querySelector("#video").srcObject=null}
    function showInfo(kind){const title=document.querySelector("#info-title"),copy=document.querySelector("#info-copy");if(kind==="stats"){title.textContent="Actividad";copy.innerHTML="<h3>Control de visitas</h3><p>Escanea una tarjeta para consultar y actualizar sus visitas. Cada cliente se identifica mediante su código individual.</p>"}else{title.textContent="Ayuda e instalación";copy.innerHTML="<h3>Cómo usar Mesa Viva Scan</h3><p>Pulsa <strong>Scan</strong>, permite el acceso a la cámara y apunta al QR de la tarjeta. Después podrás añadir una visita o corregirla.</p><p>Esta zona es únicamente para el personal.</p>"}document.querySelector("#install").classList.toggle("show",Boolean(installPrompt));showScreen("info")}
    document.querySelector("#scan").addEventListener("click",startCamera);document.querySelector("#cancel-scan").addEventListener("click",()=>showScreen("home"));document.querySelector("#search").addEventListener("click",()=>openMember(input.value));input.addEventListener("keydown",event=>{if(event.key==="Enter")openMember(input.value)});document.querySelector("#add").addEventListener("click",()=>save(1));document.querySelector("#remove").addEventListener("click",()=>save(-1));document.querySelector("#new-scan").addEventListener("click",startCamera);document.querySelector("#close-customer").addEventListener("click",()=>showScreen("home"));document.querySelector("#stats").addEventListener("click",()=>showInfo("stats"));document.querySelector("#help").addEventListener("click",()=>showInfo("help"));document.querySelector("#menu").addEventListener("click",()=>showInfo("help"));document.querySelector("#close-info").addEventListener("click",()=>showScreen("home"));window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});document.querySelector("#install").addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.querySelector("#install").classList.remove("show")});window.addEventListener("beforeunload",stopCamera);if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
